[package]
name = "sealbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Encrypt files and folders into a password-protected .sbx file (GUI + CLI)"
authors = ["Pieter Martens"]
license = "MIT"
readme = "README.md"
keywords = ["encryption", "archive", "argon2", "xchacha20", "gui"]
categories = ["cryptography", "command-line-utilities", "filesystem"]
repository = "https://github.com/xpim/sealbox"
homepage = "https://github.com/xpim/sealbox"
exclude = ["/.github"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
eframe = "0.37"
fs2 = "0.4"
rand = "0.8"
rfd = "0.18"
rpassword = "7"
tempfile = "3"
unicode-normalization = "0.1"
walkdir = "2"
zeroize = "1"
zstd = { version = "0.14", features = ["zstdmt"] }
zxcvbn = "3.1.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[[bin]]
name = "sealbox"
path = "src/main.rs"

[[bin]]
name = "sealbox-gui"
path = "src/bin/sealbox-gui.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true



# Optimise dependencies even in debug/test builds: the real Argon2 settings
# (256 MiB) used by the format tests are very slow unoptimised.
[profile.dev.package."*"]
opt-level = 3
