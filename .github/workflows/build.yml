name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sealbox-linux-x86_64
            ext: ""
          - os: windows-latest
            artifact: sealbox-windows-x86_64
            ext: ".exe"
          - os: macos-latest
            artifact: sealbox-macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/sealbox${{ matrix.ext }}
            target/release/sealbox-gui${{ matrix.ext }}
